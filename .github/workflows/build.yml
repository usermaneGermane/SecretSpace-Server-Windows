name: build

# Builds SecretSpace-Server-Installer.exe on a clean Windows runner with
# builder/build.py, the same script as on a PC, then installs it, checks the
# server answers, and uninstalls it.
#
# A pull request or a push to main keeps the installer as a workflow
# artifact. A tag v<version> also makes a DRAFT release with the installer
# and SHA256SUMS.txt; it is published by hand once its notes are written,
# so a published release never changes and is never without its files.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"
      - name: Build tools
        run: |
          python -m pip install pyinstaller==6.22.2
          choco install innosetup -y --no-progress
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'builder'); import build; print(build.app_version(build.project_dir()))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, server/version.py $version"; exit 1; }
      - name: Build
        env:
          SECRETSPACE_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: python builder/build.py
      - name: Checksums
        shell: bash
        run: sha256sum SecretSpace-Server-Installer.exe | tee SHA256SUMS.txt

      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "$env:ProgramFiles\SecretSpace Server"
          $data = "$env:ProgramData\SecretSpace Server"
          Start-Process -Wait .\SecretSpace-Server-Installer.exe -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/HOST=127.0.0.1', '/PORT=8787'
          foreach ($f in 'SecretSpace-Server.exe', 'SecretSpace-Server-Setup.exe', 'LICENSE.txt') {
            if (-not (Test-Path "$app\$f")) { throw "not installed: $f" }
          }
          if (-not (Test-Path "$data\token")) { throw "no token in $data" }
          schtasks /Query /TN "SecretSpace Sync Server" | Out-Host
          if ($LASTEXITCODE) { throw "no scheduled task" }

          $health = $null
          foreach ($try in 1..30) {
            try { $health = Invoke-RestMethod http://127.0.0.1:8787/health; break }
            catch { Start-Sleep 1 }
          }
          if (-not $health.ok) { throw "the server did not answer /health" }
          $health | ConvertTo-Json -Compress | Out-Host

          # The uninstaller copies itself to %TEMP% and exits at once, so
          # wait for the program to be gone instead.
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          foreach ($try in 1..60) {
            if (-not (Test-Path "$app\SecretSpace-Server.exe")) { break }
            Start-Sleep 1
          }
          if (Test-Path "$app\SecretSpace-Server.exe") { throw "not uninstalled" }
          schtasks /Query /TN "SecretSpace Sync Server" 2>$null | Out-Null
          if (-not $LASTEXITCODE) { throw "the task is still there" }
          # The vaults stay: uninstalling never deletes ProgramData.
          if (-not (Test-Path "$data\token")) { throw "uninstalling deleted $data" }
          $global:LASTEXITCODE = 0
          "installed, answered, uninstalled; $data kept"

      - uses: actions/upload-artifact@v4
        with:
          name: SecretSpace-Server-Installer
          path: |
            SecretSpace-Server-Installer.exe
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SecretSpace-Server-Installer
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          sha256sum -c SHA256SUMS.txt
          if draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            # A re-run may replace the files of a draft, never of a release
            # people may already have downloaded.
            [ "$draft" = true ] || { echo "$TAG is already published"; exit 1; }
            gh release upload "$TAG" SecretSpace-Server-Installer.exe SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "SecretSpace Sync Server for Windows ${TAG#v}" \
              --notes "Built by the build workflow from $TAG. Release notes to follow." \
              SecretSpace-Server-Installer.exe SHA256SUMS.txt
          fi
