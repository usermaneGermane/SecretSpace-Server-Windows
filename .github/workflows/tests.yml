name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Windows, because that is what this server ships for: Task Scheduler,
    # the firewall rule and the installer are all Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Both programs import
        # PyInstaller builds a broken exe rather than failing when a module
        # is missing, so check the same thing the builder checks.
        run: python -c "import sys; sys.path.insert(0, 'server'); import passman_server_exe, passman_server_setup_exe"
      - name: Run the tests
        run: python -m pytest -q
